<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Andropia</title>
    <style>
      :root {
        --ink: #e6e9ec;
        --dim: #8b959e;
        --panel: rgba(18, 22, 26, 0.82);
        --line: rgba(255, 255, 255, 0.09);
        --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1114; }
      canvas { display: block; }

      #hud {
        position: fixed; top: 12px; left: 12px;
        font-family: var(--mono); font-size: 12px; color: var(--ink);
        background: var(--panel); border: 1px solid var(--line);
        border-radius: 6px; padding: 10px 12px;
        backdrop-filter: blur(8px); min-width: 210px;
      }
      #hud h1 {
        margin: 0 0 8px; font-size: 12px; font-weight: 600;
        letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim);
      }
      .row { display: flex; justify-content: space-between; gap: 14px; padding: 2px 0; }
      .row span:last-child { font-variant-numeric: tabular-nums; }
      .dim { color: var(--dim); }

      #controls { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--line); }
      button {
        font-family: var(--mono); font-size: 11px; color: var(--ink);
        background: rgba(255,255,255,0.06); border: 1px solid var(--line);
        border-radius: 4px; padding: 4px 9px; cursor: pointer; margin: 2px 2px 0 0;
      }
      button:hover { background: rgba(255,255,255,0.12); }
      button:focus-visible { outline: 2px solid #79b4d0; outline-offset: 1px; }
      button.on { background: #2c6d8c; border-color: #2c6d8c; }

      #status { position: fixed; bottom: 12px; left: 12px;
        font-family: var(--mono); font-size: 11px; color: var(--dim); }
      #status.bad { color: #e08b82; }

      #hint { position: fixed; bottom: 12px; right: 12px;
        font-family: var(--mono); font-size: 11px; color: var(--dim); text-align: right; }
    </style>
  </head>
  <body>
    <div id="hud">
      <h1>Andropia</h1>
      <div class="row"><span class="dim">tick</span><span id="tick">—</span></div>
      <div class="row"><span class="dim">mode</span><span id="mode">—</span></div>
      <div class="row"><span class="dim">speed</span><span id="speed">—</span></div>
      <div class="row"><span class="dim">beings</span><span id="beings">—</span></div>
      <div id="controls">
        <button id="btn-play">resume</button>
        <button id="btn-step">step</button>
        <br />
        <button class="spd" data-v="0.25">0.25×</button>
        <button class="spd" data-v="1">1×</button>
        <button class="spd" data-v="4">4×</button>
        <button class="spd" data-v="20">20×</button>
      </div>
    </div>

    <div id="status">connecting…</div>
    <div id="hint">drag to orbit · scroll to zoom · click a being to send it somewhere</div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
