<!DOCTYPE html>
<html>
<head>
    <title>Simple Audio Recorder</title>
</head>
<body>
    <h1>Audio Recorder</h1>
    <button id="recordButton">Record</button>
    <button id="stopButton" disabled>Stop</button>
    <p id="transcribedText"></p> <!-- Element to display transcribed text -->

    <script>
        const mainBackendWebSocket = new WebSocket('ws://' + window.location.host + '/ws');

        mainBackendWebSocket.onopen = function(event) {
            console.log('Connected to the WebSocket.');
        };

        mainBackendWebSocket.onerror = function(error) {
            console.error('WebSocket Error:', error);
        };

        mainBackendWebSocket.onmessage = function(event) {
            const message = JSON.parse(event.data);
            if (message.taskId) {
                checkTaskStatus(message.taskId); // Start polling the task status
            } else if (message.transcribedText) {
                document.getElementById('transcribedText').innerText = message.transcribedText;
            }
        };

        function checkTaskStatus(taskId) {
            // Polling is now handled by the main backend, so nothing to do here.
        }

        const getMediaRecorder = (stream) => {
            const mediaRecorder = new MediaRecorder(stream);
            let audioChunks = [];

            mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
            mediaRecorder.onstop = () => {
                const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                mainBackendWebSocket.send(audioBlob);
            };

            return mediaRecorder;
        };

        document.getElementById("recordButton").addEventListener("click", () => {
            navigator.mediaDevices.getUserMedia({ audio: true })
                .then(stream => {
                    const mediaRecorder = getMediaRecorder(stream);
                    mediaRecorder.start();
                    document.getElementById("stopButton").disabled = false;
                    document.getElementById("recordButton").disabled = true;
                    document.getElementById("stopButton").onclick = () => {
                        mediaRecorder.stop();
                        document.getElementById("stopButton").disabled = true;
                        document.getElementById("recordButton").disabled = false;
                    };
                })
                .catch(err => {
                    console.error("Error accessing media devices:", err);
                });
        });
    </script>
</body>
</html>
