<!DOCTYPE html>
<html>
<head>
    <title>Simple Audio Recorder with Image Upload</title>
</head>
<body>
    <h1>Audio Recorder and Image Uploader</h1>
    <input type="file" id="imageInput" accept="image/*">
    <button id="recordButton">Record</button>
    <button id="stopButton" disabled>Stop</button>
    <p id="transcribedText"></p> <!-- Element to display transcribed text -->

    <script>
        let base64Image = '';
        let transcribedText = '';
        let mediaRecorder = null;

        const mainBackendWebSocket = new WebSocket('wss://' + window.location.host + '/ws');

        mainBackendWebSocket.onopen = function(event) {
            console.log('Connected to the WebSocket.');
        };

        mainBackendWebSocket.onerror = function(error) {
            console.error('WebSocket Error:', error);
        };

        mainBackendWebSocket.onmessage = function(event) {
            const message = JSON.parse(event.data);
            if (message.text) {
                console.log('Transcribed Text:', message.text);
                transcribedText = message.text;
                document.getElementById('transcribedText').innerText = transcribedText;
            }
            sendImageAndText();
        };

        document.getElementById('imageInput').addEventListener('change', function(event) {
            const file = event.target.files[0];
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onloadend = function() {
                base64Image = reader.result.split(',')[1];
                sendImageAndText();
            };
        });

        const getMediaRecorder = (stream) => {
            mediaRecorder = new MediaRecorder(stream);
            let audioChunks = [];

            mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
            mediaRecorder.onstop = () => {
                const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                mainBackendWebSocket.send(audioBlob);
            };

            return mediaRecorder;
        };

        document.getElementById("recordButton").addEventListener("click", () => {
            navigator.mediaDevices.getUserMedia({ audio: true })
                .then(stream => {
                    mediaRecorder = getMediaRecorder(stream);
                    mediaRecorder.start();
                    document.getElementById("stopButton").disabled = false;
                    document.getElementById("recordButton").disabled = true;
                })
                .catch(err => {
                    console.error("Error accessing media devices:", err);
                });
        });

        document.getElementById("stopButton").addEventListener("click", () => {
            mediaRecorder.stop();
            document.getElementById("stopButton").disabled = true;
            document.getElementById("recordButton").disabled = false;
        });

        function sendImageAndText() {
            let url;
            let data = {};

            if (base64Image && transcribedText) {
                // Both image and transcribed text available
                url = "http://127.0.0.1:5000/completion";
                data = {
                    prompt: "Describe the image: " + transcribedText,
                    image_data: [{ "data": base64Image, "id": generateRandomId() }]
                };
            } else if (base64Image) {
                // Only image available
                url = "http://127.0.0.1:5000/completion";
                data = {
                    image_data: [{ "data": base64Image, "id": generateRandomId() }]
                };
            } else if (transcribedText) {
                // Only transcribed text available
                url = "http://127.0.0.1:5002/completion";
                data = {
                    prompt: transcribedText
                };
            } else {
                return; // No data to send
            }

            fetch(url, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(result => {
                console.log('Processed data:', result);
            })
            .catch(error => {
                console.error('Error sending data:', error);
            });
        }

        function generateRandomId() {
            return Math.floor(Math.random() * 1000000);
        }
    </script>
</body>
</html>
