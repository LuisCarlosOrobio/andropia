<!DOCTYPE html>
<html>
<head>
    <title>Simple Audio Recorder</title>
</head>
<body>
    <h1>Audio Recorder</h1>
    <button id="recordButton">Record</button>
    <button id="stopButton" disabled>Stop</button>
    <p id="transcribedText"></p> <!-- Element to display transcribed text -->

    <script>
        const mainBackendWebSocketUrl = (window.location.protocol === 'https:' ? 'wss://' : 'ws://') + window.location.host + '/ws';
        const mainBackendWebSocket = new WebSocket(mainBackendWebSocketUrl);

        mainBackendWebSocket.onopen = function(event) {
            console.log('WebSocket connection to Main backend established.');
        };

        mainBackendWebSocket.onerror = function(error) {
            console.error('WebSocket error:', error);
        };

        // ... (rest of your existing frontend code)

        // Function to poll the status of the transcription task
        async function checkTaskStatus(taskId) {
            try {
                const response = await fetch(`/status/${taskId}`);
                const data = await response.json();
                if (data.status === 'SUCCESS') {
                    getTaskResult(taskId);
                } else if (data.status === 'FAILURE') {
                    console.error('Transcription task failed.');
                } else {
                    // Poll the status again after some delay
                    setTimeout(() => checkTaskStatus(taskId), 2000);
                }
            } catch (error) {
                console.error('Error fetching task status:', error);
            }
        }

        // Function to retrieve the transcribed text using the task ID
        async function getTaskResult(taskId) {
            try {
                const response = await fetch(`/result/${taskId}`);
                const data = await response.json();
                if (data.status === 'SUCCESS') {
                    // Display the transcribed text on the frontend
                    document.getElementById('transcribedText').innerText = data.result;
                } else {
                    console.error('Error fetching task result:', error);
                }
            } catch (error) {
                console.error('Error fetching task result:', error);
            }
        }

        // Modify the onmessage handler to start the task status check
        mainBackendWebSocket.onmessage = function(event) {
            console.log('Task ID received:', event.data);
            checkTaskStatus(event.data); // Start polling the task status
        };
    </script>
</body>
</html>
