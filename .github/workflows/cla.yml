name: CLA

# Asks first-time contributors to sign the CLA (see CLA.md) by commenting
# on their pull request. Signatures are recorded in a JSON file in a
# separate branch of this repository, so there is no third-party service
# holding the record.
#
# A contributor signs once by commenting:
#     I have read the CLA Document and I hereby sign the CLA
#
# Re-run a check after signing by commenting:
#     recheck

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened, closed]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: Check CLA signature
        if: |
          (github.event.comment.body == 'recheck' ||
           github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') ||
          github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Where signatures are stored. A dedicated branch keeps the
          # record in-repo and out of main's history.
          path-to-signatures: 'signatures/version1/cla.json'
          branch: 'cla-signatures'

          # The agreement contributors are agreeing to. Resolved from the
          # repository at run time so renaming the repo cannot break it.
          path-to-document: 'https://github.com/${{ github.repository }}/blob/main/CLA.md'

          allowlist: bot*,dependabot[bot]

          custom-notsigned-prcomment: |
            Thanks for the contribution.

            Before this can be merged, please read **[CLA.md](https://github.com/${{ github.repository }}/blob/main/CLA.md)**
            and sign by posting exactly this comment on this pull request:

            > I have read the CLA Document and I hereby sign the CLA

            You keep your copyright — this is not an assignment. The
            agreement exists so the project can never end up needing
            permission from every past contributor in order to move.

            You only ever do this once.

          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA. Thanks!'
